<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Reservation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Restaurant Reservation</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#" id="loginLink">Login</a>
                <a class="nav-link" href="#" id="registerLink">Register</a>
                <a class="nav-link d-none" href="#" id="logoutLink">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Auth Forms -->
    <div id="authForms" class="container">
        <!-- Login Form -->
        <div id="loginForm" class="form-container">
            <h2 class="form-title">Login</h2>
            <form id="loginFormElement">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-container d-none">
            <h2 class="form-title">Register</h2>
            <form id="registerFormElement">
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="container d-none">
        <!-- Admin Section -->
        <div id="adminSection" class="d-none">
            <h2 class="mb-4">Admin Panel</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Add New Table</h5>
                    <form id="addTableForm">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="tableNumber" class="form-label">Table Number</label>
                                    <input type="number" class="form-control" id="tableNumber" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="tableSeats" class="form-label">Number of Seats</label>
                                    <input type="number" class="form-control" id="tableSeats" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="tableLocation" class="form-label">Location</label>
                                    <input type="text" class="form-control" id="tableLocation" required>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Table</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- User Section -->
        <ul class="nav nav-tabs" id="userTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tables-tab" data-bs-toggle="tab" data-bs-target="#tables" type="button" role="tab">Available Tables</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reservations-tab" data-bs-toggle="tab" data-bs-target="#reservations" type="button" role="tab">My Reservations</button>
            </li>
        </ul>

        <div class="tab-content" id="userTabsContent">
            <!-- Tables Tab -->
            <div class="tab-pane fade show active" id="tables" role="tabpanel">
                <div class="row" id="tablesList">
                    <!-- Tables will be loaded here -->
                </div>
            </div>

            <!-- Reservations Tab -->
            <div class="tab-pane fade" id="reservations" role="tabpanel">
                <div id="reservationsList">
                    <!-- Reservations will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Reservation Modal -->
    <div class="modal fade" id="reservationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Make a Reservation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reservationForm">
                        <input type="hidden" id="selectedTableId">
                        <div class="mb-3">
                            <label for="reservationDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="reservationDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="reservationTimeFrom" class="form-label">Time From</label>
                            <input type="time" class="form-control" id="reservationTimeFrom" required>
                        </div>
                        <div class="mb-3">
                            <label for="reservationTimeTo" class="form-label">Time To</label>
                            <input type="time" class="form-control" id="reservationTimeTo" required>
                        </div>
                        <div class="mb-3">
                            <label for="numberOfGuests" class="form-label">Number of Guests</label>
                            <input type="number" class="form-control" id="numberOfGuests" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Make Reservation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
