<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Haven - Restaurant Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-utensils"></i> Gourmet Haven
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-none" id="logoutItem">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1>Welcome to Gourmet Haven</h1>
                <p>Experience fine dining at its best</p>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        <!-- Auth Section -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card auth-card">
                    <div class="card-body">
                        <ul class="nav nav-tabs mb-4">
                            <li class="nav-item">
                                <a class="nav-link auth-tab active" href="#" data-target="loginForm">
                                    <i class="fas fa-sign-in-alt"></i> Login
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link auth-tab" href="#" data-target="registerForm">
                                    <i class="fas fa-user-plus"></i> Register
                                </a>
                            </li>
                        </ul>
                        <div id="loginForm" class="auth-form">
                            <form>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-sign-in-alt"></i> Login
                                </button>
                            </form>
                        </div>
                        <div id="registerForm" class="auth-form d-none">
                            <form>
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="registerEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="registerPassword" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-user-plus"></i> Register
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Section -->
        <div id="mainContent" class="d-none">
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link nav-tab active" href="#" data-target="tablesTab">
                        <i class="fas fa-chair"></i> Available Tables
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-tab" href="#" data-target="reservationsTab">
                        <i class="fas fa-calendar-alt"></i> My Reservations
                    </a>
                </li>
            </ul>

            <div id="tablesTab" class="tab-content">
                <div class="row" id="tablesContainer">
                    <!-- Tables will be loaded here -->
                </div>
            </div>

            <div id="reservationsTab" class="tab-content d-none">
                <div id="reservationsContainer">
                    <!-- Reservations will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Reservation Modal -->
    <div class="modal fade" id="reservationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-calendar-plus"></i> Make a Reservation
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reservationForm">
                        <div class="mb-3">
                            <label for="reservationDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="reservationDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="reservationTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="reservationTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="numberOfGuests" class="form-label">Number of Guests</label>
                            <input type="number" class="form-control" id="numberOfGuests" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-calendar-check"></i> Confirm Reservation
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
